<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Boom! You Lookin' For This?</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0a0a0a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(to bottom, #1a1a1a, #0a0a0a);
      border-bottom: 1px solid #333;
    }

    .hero h1 {
      margin: 0;
      color: gold;
      font-size: 42px;
    }

    .hero p {
      color: #ccc;
      font-size: 18px;
    }

    .stats {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    #movieCount {
      font-size: 22px;
      font-weight: bold;
    }

    .progress-container {
      height: 24px;
      margin-top: 10px;
      overflow: hidden;
      background: #222;
      border-radius: 10px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: gold;
      transition: width 0.5s;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px 40px;
    }

    . {
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      transition: transform 0.2s;
    }

    .:hover {
      transform: translateY(-3px);
    }
    .movie-poster {
  display: block;
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  margin-bottom: 16px;
  border-radius: 12px;
  background: #222;
}

.poster-placeholder {
  display: grid;
  width: 100%;
  aspect-ratio: 2 / 3;
  place-items: center;
  margin-bottom: 16px;
  padding: 20px;
  color: #777;
  background: #222;
  border-radius: 12px;
  text-align: center;
}
.award-statue {
  width: 80px;
  height: auto;
  display: block;
  margin: 0 auto 20px;
  filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.4));
}
    .movie-title {
      margin-bottom: 12px;
      color: gold;
      font-size: 24px;
      font-weight: bold;
    }

    .stars {
      min-height: 24px;
      margin-bottom: 10px;
      color: gold;
      font-size: 20px;
    }

    .field {
      margin-bottom: 8px;
      color: #ddd;
    }

    .label {
      color: #999;
    }

    .error {
      grid-column: 1 / -1;
      padding: 20px;
      color: #ff8a8a;
      background: #2a1111;
      border: 1px solid #7a3333;
      border-radius: 12px;
    }
.add-movie-section {
  max-width: 700px;
  margin: 32px auto;
  padding: 24px;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 16px;
}

.add-movie-section h2 {
  margin-top: 0;
  color: gold;
}

#addMovieForm {
  display: grid;
  gap: 10px;
}

#addMovieForm label {
  margin-top: 8px;
  color: #ccc;
  font-weight: bold;
}

#addMovieForm input,
#addMovieForm select,
#addMovieForm textarea {
  width: 100%;
  padding: 12px;
  color: white;
  background: #111;
  border: 1px solid #555;
  border-radius: 8px;
  font: inherit;
}

#addMovieForm textarea {
  resize: vertical;
}

#addMovieForm button {
  margin-top: 14px;
  padding: 13px 18px;
  color: #111;
  background: gold;
  border: 0;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#addMovieForm button:hover {
  background: #ffe34d;
}

#addMovieForm button:disabled {
  cursor: wait;
  opacity: 0.6;
}

#formMessage {
  min-height: 24px;
  margin-top: 8px;
  color: #ccc;
}
    @media (max-width: 600px) {
      .hero {
        padding: 36px 16px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 16px;
      }

      .movie-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="hero">
  <img src="award-statue.png" class="award-statue" alt="Gold award statue">
<h1>Boom! You Lookin' For This?</h1>
<p>Joel's Best Picture Journey</p>  </header>

  <main>
    <section class="add-movie-section">
  <h2>Add a Movie</h2>

  <form id="addMovieForm">
    <label for="title">Movie title</label>
    <input id="title" name="title" type="text" required>

    <label for="winningYear">Best Picture year</label>
    <input
      id="winningYear"
      name="winningYear"
      type="number"
      min="1927"
      max="2100"
      required
    >

    <label for="rating">My rating</label>
    <select id="rating" name="rating" required>
      <option value="">Choose a rating</option>
      <option value="1">★</option>
      <option value="2">★★</option>
      <option value="3">★★★</option>
      <option value="4">★★★★</option>
      <option value="5">★★★★★</option>
    </select>

    <label for="dateWatched">Date watched</label>
    <input
      id="dateWatched"
      name="dateWatched"
      type="date"
      required
    >

    <label for="timeCapsuleQuestion">Time-capsule question</label>
    <select
      id="timeCapsuleQuestion"
      name="timeCapsuleQuestion"
      required
    >
      <option value="">Choose a question</option>
      <option value="What surprised me most about this movie?">
        What surprised me most about this movie?
      </option>
      <option value="What will I remember most about watching it?">
        What will I remember most about watching it?
      </option>
      <option value="What was happening in my life when I watched it?">
        What was happening in my life when I watched it?
      </option>
      <option value="What did this movie make me think about?">
        What did this movie make me think about?
      </option>
      <option value="Would I recommend it, and to whom?">
        Would I recommend it, and to whom?
      </option>
    </select>

    <label for="timeCapsuleAnswer">My answer</label>
    <textarea
      id="timeCapsuleAnswer"
      name="timeCapsuleAnswer"
      rows="5"
      required
    ></textarea>

    <button type="submit">Add Movie</button>

    <div id="formMessage"></div>
  </form>
</section>
    <section class="stats">
      <div id="movieCount">Loading movies...</div>

      <div
        class="progress-container"
        role="progressbar"
        aria-label="Best Picture viewing progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <section class="movie-grid" id="movies"></section>
  </main>

  <script>
    const supabaseClient = supabase.createClient(
      'https://spgwqgjzpaqcynkekebb.supabase.co',
      'sb_publishable_ydQ0uI84t5JXPke0eYcbcQ_UimwJrm9'
    );

    const totalBestPictureWinners = 98;
const TMDB_API_KEY = '52fd835c9c4933dc2c74fcaf48736a5d';
    
   function escapeHtml(value) {
  return String(value ?? '');
}
async function getPoster(title, year) {
  try {
    const searchUrl =
      `https://api.themoviedb.org/3/search/movie` +
      `?api_key=${TMDB_API_KEY}` +
      `&query=${encodeURIComponent(title)}` +
      `&year=${encodeURIComponent(year)}`;

    const response = await fetch(searchUrl);

    if (!response.ok) {
      console.error('TMDb request failed:', response.status);
      return '';
    }

    const data = await response.json();
    const movieResult = data.results?.find(result => result.poster_path);

    if (!movieResult) {
      return '';
    }

    return `https://image.tmdb.org/t/p/w500${movieResult.poster_path}`;
  } catch (error) {
    console.error('TMDb poster error:', error);
    return '';
  }
}
    async function loadMovies() {document.getElementById('movieCount').innerText =
  'Reached loadMovies()';

      const movieCount = document.getElementById('movieCount');
      const progressBar = document.getElementById('progressBar');
      const progressContainer = document.querySelector(
        '.progress-container'
      );
      const container = document.getElementById('movies');

      const { data, error } = await supabaseClient
        .from('movie_entries')
        .select('*')
        .order('date_watched', { ascending: false });

      if (error) {
        movieCount.textContent = 'Unable to load movies';

        container.innerHTML = `
          <div class="error">
            <strong>Supabase error:</strong>
            ${escapeHtml(error.message)}
          </div>
        `;

        console.error('Supabase error:', error);
        return;
      }

      const movies = data || [];

      const percent = Math.min(
        (movies.length / totalBestPictureWinners) * 100,
        100
      );

      movieCount.textContent =
        `🎬 ${movies.length} Best Picture Winners Watched`;

      progressBar.style.width = `${percent}%`;

      progressContainer.setAttribute(
        'aria-valuenow',
        String(Math.round(percent))
      );

      if (movies.length === 0) {
        container.innerHTML = `
          <div class="movie-card">
            <div class="movie-title">No movies found</div>

            <div class="field">
              The Supabase connection worked, but the movie_entries
              table returned no rows.
            </div>
          </div>
        `;

        return;
      }

      const movieCards = await Promise.all(
  movies.map(async movie => {
    const posterUrl = await getPoster(
      movie.title,
      movie.winning_year
    );

    const rating = Math.max(
      0,
      Math.min(5, Number(movie.rating) || 0)
    );

    const stars = '★'.repeat(Math.floor(rating));

    const posterHtml = posterUrl
      ? `\x3Cimg
           src="${posterUrl}"
           class="movie-poster"
           alt="${escapeHtml(movie.title)} poster"
           loading="lazy"
         \x3E`
      : `\x3Cdiv class="poster-placeholder"\x3ENo poster available\x3C/div\x3E`;

    return `
      <article class="movie-card">
        ${posterHtml}

        <div class="movie-title">
          ${escapeHtml(movie.title)}
        </div>

        <div
          class="stars"
          aria-label="Rating: ${rating} out of 5"
        >
          ${stars || 'Not rated'}
        </div>

        <div class="field">
          <span class="label">Best Picture Year:</span>
          ${escapeHtml(movie.winning_year) || 'Not entered'}
        </div>
      </article>
    `;
  })
);

container.innerHTML = movieCards.join('');
    }
const addMovieForm = document.getElementById('addMovieForm');
const formMessage = document.getElementById('formMessage');

addMovieForm.addEventListener('submit', async event => {
  event.preventDefault();

  const submitButton = addMovieForm.querySelector(
    'button[type="submit"]'
  );

  submitButton.disabled = true;
  submitButton.textContent = 'Adding movie...';
  formMessage.textContent = '';

  const newMovie = {
    title: document.getElementById('title').value.trim(),
    winning_year: Number(
      document.getElementById('winningYear').value
    ),
    rating: Number(
      document.getElementById('rating').value
    ),
    date_watched:
      document.getElementById('dateWatched').value,
    time_capsule_question:
      document.getElementById('timeCapsuleQuestion').value,
    time_capsule_answer:
      document.getElementById('timeCapsuleAnswer').value.trim()
  };

  const { error } = await supabaseClient
    .from('movie_entries')
    .insert([newMovie]);

  if (error) {
    formMessage.textContent =
      `Unable to add movie: ${error.message}`;

    formMessage.style.color = '#ff8a8a';
    console.error('Supabase insert error:', error);
  } else {
    formMessage.textContent =
      `${newMovie.title} was added successfully.`;

    formMessage.style.color = '#8cff9b';
    addMovieForm.reset();

    document.getElementById('movies').innerHTML = '';
    await loadMovies();
  }

  submitButton.disabled = false;
  submitButton.textContent = 'Add Movie';
});
    loadMovies();
  </script>
</body>
</html>
